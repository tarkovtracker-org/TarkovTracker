# Preview deployments are isolated and anonymous. GitHub Actions (the trusted preview controller
# in .github/workflows/preview.yml) uploads validated builds here with this configuration.
# vars is non-inheritable, so keys are repeated. APP_URL is present but empty: the Actions build
# sets the controlled preview branch alias explicitly, and the application derives per-deployment
# host trust from it. Supabase, analytics, Turnstile, Stripe prices, and log forwarding are
# deliberately empty so previews never carry production identifiers; the application's offline
# Supabase fallback activates on `pages.dev` hostnames. Production KV and Durable Object bindings
# are intentionally absent: the precomputed-payload readers and the rate limiter degrade to their
# Cache API paths, so previews still serve public game data through /api/tarkov/*. Preview
# environment secrets (service-role, Stripe, Turnstile, log sinks) are managed in the Pages
# dashboard and must remain unset so previews stay isolated.
[env.preview.vars]
NODE_ENV = "production"
APP_URL = ""
GA_MEASUREMENT_ID = ""
CLARITY_PROJECT_ID = ""
NUXT_PUBLIC_CLIENT_LOG_SINK_URL = ""
NUXT_PUBLIC_TURNSTILE_SITE_KEY = ""
SUPABASE_URL = ""
SUPABASE_ANON_KEY = ""
