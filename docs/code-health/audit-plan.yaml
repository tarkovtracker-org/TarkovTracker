# Code Health Program — audit inventory and work queue.
# See docs/code-health/README.md for methodology, statuses, and completion criteria.
#
# Field contract (every item):
#   id                    stable identifier, CH-NNN
#   area                  human-readable subsystem name
#   paths                 globs/files that define the slice (used for re-audit checks)
#   status                queued | in_progress | blocked | pr_open | completed
#   priority              P0 (highest) .. P3
#   dependencies          list of CH ids that must be `completed` first
#   last_reviewed_commit  origin/main SHA the audit was performed against (null until reviewed)
#   findings_summary      concrete evidence / findings (why this is on the queue)
#   metrics_before        relevant measurements at selection time
#   metrics_after         relevant measurements after the slice landed (null until completed)
#   pr                    PR number (null until opened)
#   notes                 decisions, constraints, hand-off context for future agents
#
# Evidence sources (repository-configured; do not invent thresholds):
#   pnpm exec fallow health --hotspots --targets      (churn x complexity x fan-in)
#   pnpm exec fallow health --complexity --sort severity
#   pnpm exec fallow dupes / dead-code
#   wc -l on production files; git log churn; AGENTS.md + docs/SYSTEMS.md invariants
