    area: Progress invalidation (shared algorithm for app + public API)
    paths:
      - shared/utils/progressInvalidation.ts
      - app/utils/progressInvalidation.ts
      - workers/api-gateway/src/utils/invalidation.ts
      - workers/api-gateway/src/utils/transform.ts
    status: pr_open
    priority: P0
    dependencies: []
    last_reviewed_commit: null
    findings_summary: >-
      Two independent implementations of computeInvalidProgress (app + api-gateway worker):
      fallow dupes reports 4 clone groups / 106 duplicated lines between them. They have
      DIVERGED: commit 3787dc65 ("honor failed prereqs in invalidation") added acceptsFailedStatus
      handling only to the app copy, so the public /progress API still marks tasks invalid when a
      requirement explicitly accepts `failed` (e.g. Dragnet, Safe Corridor). The app copy also
      carries a dead `childOnly` parameter (never true). A `@shared` alias already exists and is
      wired for Nuxt, the worker tsconfig, and the worker vitest config (shared/utils/userMetadata.ts
      precedent).
    metrics_before:
      duplicated_lines_between_copies: 106
      clone_groups: 4
      implementations: 2
    metrics_after:
      duplicated_lines_between_copies: 0
      clone_groups: 0
      implementations: 1
      fallow_audit_new_only_gate: pass
      note: >-
        old copies reported invalidateTaskRecursive at CRAP 132 (app) / 31.6 (worker); the shared
        function has no Fallow complexity finding. Repo duplicate clone groups 7 -> 3.
    pr: 876
    notes: >-
      Consolidated into shared/utils/progressInvalidation.ts typed against a minimal structural task
      shape (InvalidationTask); both copies deleted; worker adopts the app's (correct) behavior —
      intentional behavior change for the public /progress API: tasks whose requirement status
      includes `failed` are no longer reported invalid when the prerequisite failed. Dead `childOnly`
      parameter removed. The existing `alternatives` cascade is preserved unchanged (see CH-028).
      Regression test: workers/api-gateway/src/__tests__/transform.test.ts (verified to fail against
      the old worker copy). Local coverage include now lists shared/**/*.ts so the moved module stays
      in the denominator. Validation run: shared + consumer vitest (72 files / 1257 tests), full
      api-gateway suite (190), lint, format:check, typecheck, worker typecheck + types:check +
      wrangler dry-run, lint:fallow, systems:check, CI-mode build, git diff --check.
      HAND-OFF (2026-09-17): PR #876 open, ready for review. On 567198bf the required `CI Result`
      check passed, Codex review completed with no findings, Codecov patch 100%, Cloudflare Pages
      preview deployed after one retry (first attempt failed inside Cloudflare's build image:
      `node-build: definition not found: 24.19.0` — infra, not code). SonarCloud quality gate
      failed on 7.9% duplicated new code in the shared test fixtures; fixed in 31e652fc with a
      fixture builder. NEXT RUN: confirm `CI Result`, SonarCloud, CodeRabbit and cubic are green on
      the head commit, address any actionable review threads, squash-merge #876, verify `main`
      CI, then set status=completed, last_reviewed_commit=<merge sha>.
