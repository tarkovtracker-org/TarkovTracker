coverage:
  status:
    project:
      default:
        target: auto
        threshold: 5%
      # Absolute floor replacing the vitest per-metric thresholds
      # (branches: 15, functions: 20, lines: 20, statements: 20) that were
      # disabled when test sharding landed. Codecov merges the per-shard lcov
      # uploads, so this gate sees the full-project coverage number. Actual
      # coverage is ~56% statements / ~45% branches, so 20% is a catastrophic-
      # drop guard, not a quality bar — same role the vitest thresholds played.
      absolute-floor:
        target: 20
        threshold: 0%
    patch:
      default:
        target: auto
        threshold: 10%
bundle_analysis:
  status: informational
  warning_threshold: 5%
comment:
  layout: 'condensed-header, condensed-files, footer'
  require_changes: true
  require_bundle_changes: true
  bundle_change_threshold: '1Kb'
ignore:
  - 'app/locales/**'
  - 'app/**/*.d.ts'
  - 'supabase/**'
  - 'workers/**'
  - 'scripts/**'
  - 'tests/**'
  - 'docs/**'
  - 'public/**'
