# zizmor configuration (https://docs.zizmor.sh/configuration/).
# Runs in the CI `Lint & Format` job when `.github/` changes. Every ignore below is an accepted,
# documented design decision; add a justification with any new entry.
rules:
  dangerous-triggers:
    ignore:
      # Release must run with write credentials after CI completes on main. The job never
      # executes candidate code before `release-gate.mjs` validates the exact SHA; see
      # docs/WORKFLOW_AUTOMATION.md "Release Automation".
      - release.yml
      # Auto-merge uses a trusted post-CI workflow_run because Dependabot PR events get read-only
      # tokens. It never checks out or executes PR code; it checks live metadata and merges only
      # allowlisted lockfile-only changes; see docs/WORKFLOW_AUTOMATION.md "Dependabot Auto Merge".
      - dependabot-auto-merge.yml
      # The preview controller is the intended trusted boundary for `workflow_run` and
      # `pull_request_target`: every job checks out the default branch only, treats CI artifacts
      # and manifests as claims verified against live GitHub state, never installs or executes
      # candidate code, and holds the Cloudflare token in protected deployment environments; see
      # docs/SYSTEMS.md "Actions-owned Cloudflare previews" and scripts/ci-tests/preview-workflow.mjs.
      - preview.yml
  # `./.github/actions/...` is the form the workflow fixtures in scripts/ci-tests assert on; the
  # `$/` alias is equivalent for a same-repository composite action and offers no security gain.
  self-repository:
    disable: true
