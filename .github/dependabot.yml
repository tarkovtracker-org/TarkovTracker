version: 2
updates:
  # package-ecosystem remains "npm" for pnpm projects; Dependabot detects pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: America/New_York
    open-pull-requests-limit: 3
    rebase-strategy: auto
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps)
    versioning-strategy: increase-if-necessary
    allow:
      - dependency-type: direct
    ignore:
      - dependency-name: fast-xml-parser
        update-types:
          - version-update:semver-major
      # Direct dependencies pinned by a pnpm-workspace.yaml override: the override wins, so a
      # package.json bump changes nothing and fails the whole grouped job (NoChangeError).
      # vue-i18n and the @intlify core packages must move in lockstep; edit the override instead.
      - dependency-name: vue-i18n
      - dependency-name: '@intlify/message-compiler'
      - dependency-name: lru-cache
    groups:
      # Auth and billing clients are confirm-required: this group is never auto-merged.
      auth-and-billing:
        patterns:
          - stripe
          - '@stripe/*'
          - '@supabase/*'
          - supabase
        update-types:
          - minor
          - patch
      nuxt-ecosystem:
        dependency-type: production
        patterns:
          - nuxt
          - '@nuxt/*'
          - '@nuxtjs/*'
          - '@unhead/*'
          - '@vueuse/*'
          - vue
          - vue-router
        update-types:
          - minor
          - patch
      lint-and-format:
        dependency-type: development
        patterns:
          - eslint*
          - '@nuxt/eslint'
          - prettier
          - prettier-*
          - '@commitlint/*'
          - lint-staged
          - husky
        update-types:
          - minor
          - patch
      testing-tooling:
        dependency-type: development
        patterns:
          - vitest
          - '@vitest/*'
          - '@nuxt/test-utils'
          - '@vue/test-utils'
          - happy-dom
          - fake-indexeddb
        update-types:
          - minor
          - patch
      typescript-and-types:
        dependency-type: development
        patterns:
          - typescript
          - '@types/*'
          - tsx
        update-types:
          - minor
          - patch
      tailwind-tooling:
        dependency-type: development
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
          - postcss
          - prettier-plugin-tailwindcss
        update-types:
          - minor
          - patch
      cloudflare-tooling:
        patterns:
          - wrangler
          - '@cloudflare/*'
        update-types:
          - minor
          - patch
      release-tooling:
        dependency-type: development
        patterns:
          - semantic-release
          - '@semantic-release/*'
        update-types:
          - minor
          - patch
      remaining-npm:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '04:00'
      timezone: America/New_York
    open-pull-requests-limit: 1
    rebase-strategy: auto
    # Let newly published action releases settle before adopting them (supply-chain hygiene).
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
    groups:
      official-actions:
        patterns:
          - actions/*
          - github/codeql-action
        update-types:
          - major
          - minor
          - patch
      # Minor and patch updates for every non-official action land in one PR so the single open
      # slot is not consumed by one action at a time (codecov, setup-deno, crowdin, lychee,
      # lighthouse-ci, ...). Major updates stay individual so each gets its own review.
      third-party-actions:
        patterns:
          - '*'
        exclude-patterns:
          - actions/*
          - github/codeql-action
        update-types:
          - minor
          - patch
