name: Crowdin Sync
on:
  push:
    branches:
      - main
    paths:
      - 'app/locales/en.json'
      - 'crowdin.yml'
      - '.github/workflows/crowdin.yml'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
# All triggers share the same Crowdin project and localization branch.
concurrency:
  group: crowdin-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'tarkovtracker-org/TarkovTracker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Synchronize Crowdin translations
        id: crowdin
        uses: crowdin/github-action@0d5670f539973aea2f01abce61a8989934df0025 # v3
        with:
          upload_sources: true
          upload_translations: false
          download_translations: true
          crowdin_branch_name: main
          localization_branch_name: locales
          create_pull_request: true
          pull_request_base_branch_name: main
          pull_request_title: 'chore(i18n): update translations from Crowdin'
          pull_request_body: 'Automated translation updates from Crowdin.'
          commit_message: 'chore(i18n): update translations from Crowdin'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
      - name: Resolve Crowdin PR
        id: resolve-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTION_PR: ${{ steps.crowdin.outputs.pull_request_number }}
        run: |
          pr="$ACTION_PR"
          if [ -z "$pr" ]; then
            pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head locales --base main --state open --json number --jq '.[0].number // empty')"
          fi
          if [ -n "$pr" ]; then
            echo "pr_number=$pr" >> "$GITHUB_OUTPUT"
            echo "Found open Crowdin PR #$pr"
          else
            echo "No open Crowdin PR to auto-merge."
          fi
      - uses: ./.github/actions/setup-project
        if: steps.resolve-pr.outputs.pr_number != ''
      - name: Validate translations and auto-merge
        if: steps.resolve-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve-pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          shopt -s extglob
          echo "Validating Crowdin PR #$PR_NUMBER..."
          invalid_files="$(
            gh pr view "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json files \
              --jq '.files[].path' |
              while IFS= read -r file; do
                case "$file" in
                  app/locales/!(en).json)
                    ;;
                  *)
                    printf '%s\n' "$file"
                    ;;
                esac
              done
          )"
          if [ -n "$invalid_files" ]; then
            echo "::error::Crowdin PR modified non-translation files:"
            printf '%s\n' "$invalid_files"
            exit 1
          fi

          git fetch origin locales
          git checkout locales

          pnpm run format:check
          pnpm run i18n:check
          pnpm run systems:check

          echo "Validation passed. Waiting for mergeability state..."
          merge_state="UNKNOWN"
          deadline=$((SECONDS + 60))
          while true; do
            pr_state="$(
              gh pr view "$PR_NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --json mergeStateStatus
            )"
            merge_state="$(jq -r '.mergeStateStatus' <<< "$pr_state")"
            if [ "$merge_state" != "UNKNOWN" ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for merge state to resolve (still UNKNOWN)."
              exit 1
            fi
            sleep 3
          done

          echo "Auto-merging Crowdin PR #$PR_NUMBER..."
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --subject "chore(i18n): update translations from Crowdin (#$PR_NUMBER)"
