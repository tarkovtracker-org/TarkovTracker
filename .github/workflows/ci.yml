name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    name: Validation plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Read-only API access for the trusted merge-queue reuse lookup below.
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      full: ${{ steps.plan.outputs.full }}
      tooling: ${{ steps.plan.outputs.tooling }}
      i18n: ${{ steps.plan.outputs.i18n }}
      workflows: ${{ steps.plan.outputs.workflows }}
      preview: ${{ steps.plan.outputs.preview }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Queue reuse is decided by main's code, never the candidate's (docs/systems/previews.md).
      - name: Checkout trusted queue reuse policy
        if: github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted-main
          persist-credentials: false
      - name: Reuse an identical validated PR tree
        id: reuse
        if: github.event_name == 'merge_group'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { existsSync } = await import('node:fs');
            const policy = `${process.env.GITHUB_WORKSPACE}/.trusted-main/scripts/preview/queue-reuse.mjs`;
            if (!existsSync(policy)) {
              core.setOutput('reused', 'false');
              return;
            }
            const { reportQueueReuse } = await import(policy);
            await reportQueueReuse({ github, context, core });
      - name: Classify changes
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          QUEUE_REUSED: ${{ steps.reuse.outputs.reused }}
        # PRs select by path/proof; queues reduce only inert docs, verified formatter locks, or a
        # tree identical to a fully validated PR revision. Pushes and dispatches stay full.
        # Rollback: re-add the shadow flag of scripts/ci/validate-changes.mjs to force every job and
        # invert the shadow-flag assertion in scripts/workflow-tests/workflows.mjs in the same change.
        run: |
          args=(--mode ci --explain --base "$BASE_SHA" --head "$HEAD_SHA")
          if [ "$EVENT_NAME" = "merge_group" ]; then
            args+=(--queue)
            if [ "$QUEUE_REUSED" = "true" ]; then
              args+=(--reused)
            fi
          elif [ "$EVENT_NAME" != "pull_request" ]; then
            args+=(--full)
          fi
          node scripts/ci/validate-changes.mjs "${args[@]}"
  fallow:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: Fallow audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Resolve Fallow base
        id: fallow-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; then
            BASE="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          else
            BASE="$PUSH_BEFORE_SHA"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="origin/main"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
      - name: Audit changed files
        env:
          FALLOW_BASE: ${{ steps.fallow-base.outputs.base }}
        run: pnpm run lint:fallow --base "$FALLOW_BASE"
      # Advisory: reports base-to-head size and Fallow health deltas in the job summary.
      - name: Codebase metrics
        continue-on-error: true
        env:
          FALLOW_BASE: ${{ steps.fallow-base.outputs.base }}
        run: pnpm run metrics --base "$FALLOW_BASE" --summary "$GITHUB_STEP_SUMMARY"
  lint-format:
    needs: changes
    name: Lint & Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Lint
        if: needs.changes.outputs.tooling == 'true'
        run: pnpm run lint
      - name: Format check
        env:
          FULL_VALIDATION: ${{ needs.changes.outputs.tooling }}
        run: |
          if [ "$FULL_VALIDATION" = "true" ]; then
            pnpm run format:check:prettier
          else
            pnpm run format:check
          fi
      - name: Validate locales
        if: needs.changes.outputs.i18n == 'true'
        run: pnpm run i18n:check
      - name: Test blank-line scanners with coverage
        if: needs.changes.outputs.tooling == 'true'
        run: pnpm run test:blank-lines
      - name: Test workflow tooling
        if: needs.changes.outputs.tooling == 'true'
        env:
          WORKFLOW_TEST_PLAN: ${{ needs.changes.outputs.plan }}
          WORKFLOW_TEST_EVENT: ${{ github.event_name }}
        run: pnpm run test:workflow
      - name: Lint GitHub Actions workflows
        if: needs.changes.outputs.workflows == 'true'
        # Pinned, checksum-verified actionlint (syntax, expressions, shellcheck) and zizmor
        # (workflow security) release binaries. Both stay out of package.json: they are not Node
        # tooling. Checksums match the `digest` GitHub records for each release asset.
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          ZIZMOR_VERSION: 1.30.1
          ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
          # Read-only token enables zizmor's online audits (impostor commits, known-vulnerable actions).
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_verified() {
            local archive="$RUNNER_TEMP/$1.tar.gz"
            curl --proto '=https' --proto-redir '=https' -sSfL -o "$archive" "$2"
            echo "$3  ${archive}" | sha256sum --check --strict
            tar -xzf "$archive" -C "$RUNNER_TEMP" "$1"
          }
          fetch_verified actionlint \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "$ACTIONLINT_SHA256"
          fetch_verified zizmor \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
            "$ZIZMOR_SHA256"
          # Validate GitHub's newer queue:max extension, then retain all native parser/security checks.
          env -u GH_TOKEN node scripts/ci/actionlint-queue.mjs "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/zizmor" --no-progress --min-severity low .github/
  typecheck:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: Type Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Type check
        run: pnpm run typecheck
  test:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: Test (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    env:
      CI: 'true'
      VITEST_SHARD: ${{ matrix.shard }}/${{ matrix.total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Setup Deno
        if: matrix.shard == 1
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.4
      - name: Run Deno tests
        if: matrix.shard == 1
        run: pnpm run test:deno
      - name: Run shard ${{ matrix.shard }}/${{ matrix.total }}
        run: pnpm exec vitest run --coverage --shard="$VITEST_SHARD"
      - name: Upload blob report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage/lcov.info
          flags: unittests-shard-${{ matrix.shard }}
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true) && !cancelled()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          report_type: test_results
          files: ./test-report.junit.xml
          flags: unittests-shard-${{ matrix.shard }}
          fail_ci_if_error: false
  # Shards skip thresholds; merging their blob reports applies the vitest.config.ts thresholds.
  coverage:
    needs: [changes, test]
    if: needs.changes.outputs.full == 'true'
    name: Coverage thresholds
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Download blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true
      - name: Merge shards and enforce thresholds
        run: pnpm exec vitest run --merge-reports --coverage
      - name: Upload merged coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-final
          path: coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 30
  validate:
    needs: changes
    # Translation-only pull requests keep the reduced test selection but still build a preview.
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.preview == 'true'
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      # Main builds keep the production configuration. Pull requests and non-main dispatches build
      # the anonymous preview profile (scripts/preview/profile.mjs) whose output the trusted preview
      # controller later uploads to the existing Pages preview environment. Candidate builds receive
      # no deployment credentials; the exported values below are build inputs only.
      - name: Resolve build profile
        id: profile
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLARITY_PROJECT_ID: ${{ vars.CLARITY_PROJECT_ID }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: node scripts/preview/build-profile.mjs
      - name: Build
        run: pnpm run build
      - name: Verify compiled legacy retirement boundary
        run: node --test scripts/checks/legacy-api-pages.mjs
      - name: Write preview manifest
        if: steps.profile.outputs.profile == 'preview'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          PREVIEW_BRANCH: ${{ steps.profile.outputs.preview_branch }}
          APP_URL: ${{ steps.profile.outputs.app_url }}
        run: node scripts/preview/write-manifest.mjs
      - name: Upload preview build
        if: steps.profile.outputs.profile == 'preview'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-preview
          path: dist
          if-no-files-found: error
          retention-days: 7
      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ github.sha }}
          path: dist
          retention-days: 7
  supabase-db:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: Supabase DB
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The CLI defaults to public.ecr.aws, then ghcr.io, then Docker Hub, with backoff on every
      # image. Hosted runners regularly exhaust the anonymous ECR data quota ("Data limit exceeded")
      # and hit ghcr.io burst throttling, which added minutes per run. GitHub-hosted runners are
      # exempt from Docker Hub pull limits, so pull Supabase's Docker Hub images directly.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Validate Supabase migrations
        run: pnpm run supabase:check
  systems-drift:
    name: Systems drift check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Systems drift check
        run: node scripts/checks/check-systems-drift.mjs
  workers:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: Workers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Check released contracts ownership and pins
        run: pnpm run check:progress-contracts
      - name: Check versioned API and frontend parity in every mode
        run: pnpm run verify:api-parity
  # Dependency audit, Gitleaks, and CodeQL run for every CI event and gate `CI Result`. The reusable
  # workflow's scanner errors, cancellations, or missing jobs surface as a non-success result here.
  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      actions: read
      contents: read
      security-events: write
  ci-result:
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    name: CI Result
    if: always()
    needs:
      [
        changes,
        fallow,
        lint-format,
        typecheck,
        test,
        coverage,
        validate,
        supabase-db,
        systems-drift,
        workers,
        security,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted CI aggregation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Never execute candidate-branch code in the status-writing job.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Require all selected jobs to succeed
        id: validation
        env:
          VALIDATION_PLAN: ${{ needs.changes.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/check-ci-result.mjs
      - name: Report dispatched CI to branch rules
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          REVIEW_ADMISSION_APP_ID: ${{ vars.REVIEW_ADMISSION_APP_ID }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        with:
          script: |
            const { reportDispatchedCi } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/report-dispatched-ci.mjs`);
            await reportDispatchedCi({ github, context, outcome: process.env.VALIDATION_OUTCOME });
