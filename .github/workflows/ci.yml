name: CI

on:
  push:
    branches: [main, develop, 'wip/**']
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '24.12.0'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx nuxt typecheck

      - name: Format check
        run: npx prettier --check "app/**/*.{js,ts,tsx,vue,json,json5,css,md}" "nuxt.config.ts" "vitest.config.ts"

      - name: Test
        run: npx vitest run --dangerouslyIgnoreUnhandledErrors --reporter=default --maxWorkers=2

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: .output
          retention-days: 7

  workers:
    name: Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Validate api-gateway
        if: hashFiles('workers/api-gateway/package.json') != ''
        working-directory: workers/api-gateway
        run: |
          npm ci
          npm run typecheck
          npm run validate:openapi

      - name: Validate team-gateway
        if: hashFiles('workers/team-gateway/package.json') != ''
        working-directory: workers/team-gateway
        run: |
          npm ci
          npm run typecheck
