name: CI
on:
  push:
    branches: [main, develop, 'wip/**']
  pull_request:
    branches: [main, develop]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  changes:
    name: Validation plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      full: ${{ steps.plan.outputs.full }}
      i18n: ${{ steps.plan.outputs.i18n }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Classify changes (shadow rollout)
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(--mode ci --explain --base "$BASE_SHA" --head "$HEAD_SHA" --shadow)
          if [ "$EVENT_NAME" != "pull_request" ]; then args+=(--full); fi
          node scripts/validate-changes.mjs "${args[@]}"
  fallow:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: Fallow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Resolve Fallow base
        id: fallow-base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="origin/main"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
      - name: Audit changed files
        run: pnpm run lint:fallow --base "${{ steps.fallow-base.outputs.base }}"
  lint-format:
    needs: changes
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Lint
        if: needs.changes.outputs.full == 'true'
        run: pnpm run lint
      - name: Format check
        env:
          FULL_VALIDATION: ${{ needs.changes.outputs.full }}
        run: |
          if [ "$FULL_VALIDATION" = "true" ]; then
            pnpm run format:check:prettier
          else
            pnpm run format:check
          fi
      - name: Validate locales
        if: needs.changes.outputs.i18n == 'true'
        run: pnpm run i18n:check
      - name: Test workflow tooling
        if: needs.changes.outputs.full == 'true'
        run: pnpm run test:workflow
  typecheck:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Type check
        run: pnpm run typecheck
  test:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: Test (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    env:
      CI: 'true'
      VITEST_SHARD: ${{ matrix.shard }}/${{ matrix.total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Setup Deno
        if: matrix.shard == 1
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4
      - name: Run Deno tests
        if: matrix.shard == 1
        run: deno test supabase/functions/_shared/*.deno.test.ts
      - name: Run shard ${{ matrix.shard }}/${{ matrix.total }}
        run: pnpm exec vitest run --coverage --shard=${{ matrix.shard }}/${{ matrix.total }}
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage/lcov.info
          flags: unittests-shard-${{ matrix.shard }}
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true) && !cancelled()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          report_type: test_results
          files: ./test-report.junit.xml
          flags: unittests-shard-${{ matrix.shard }}
          fail_ci_if_error: false
  validate:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Build
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true
        run: pnpm run build
        env:
          NODE_ENV: production
          APP_URL: https://tarkovtracker.org
          CLARITY_PROJECT_ID: ${{ vars.CLARITY_PROJECT_ID }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-${{ github.sha }}
          path: dist
          retention-days: 7
  supabase-db:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: Supabase DB
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Validate Supabase migrations
        run: pnpm run supabase:check
  systems-drift:
    name: Systems drift check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Systems drift check
        run: node scripts/check-systems-drift.mjs
  workers:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Validate api-gateway
        if: hashFiles('workers/api-gateway/package.json') != ''
        run: |
          pnpm --filter api-gateway run types:check
          pnpm --filter api-gateway run typecheck
          pnpm --filter api-gateway run validate:openapi
          pnpm --filter api-gateway exec wrangler deploy --config wrangler.toml --dry-run
      - name: Test api-gateway
        if: hashFiles('workers/api-gateway/package.json') != ''
        run: pnpm run test:api-gateway
  ci-result:
    name: CI Result
    if: always()
    needs: [changes, fallow, lint-format, typecheck, test, validate, supabase-db, systems-drift, workers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Require all selected jobs to succeed
        env:
          VALIDATION_PLAN: ${{ needs.changes.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/check-ci-result.mjs
