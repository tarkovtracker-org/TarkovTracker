name: Release
on:
  # Batched releases: every merge still deploys on its own, independently of this workflow.
  schedule:
    # Check daily so stale-main, unfinished-CI and failed attempts can catch up automatically.
    # The gate permits publication only seven days after the latest stable release.
    - cron: '0 15 * * *' # Daily 15:00 UTC; weekly publication cadence
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    # Only main CI can wake finalization; the job and gate still authenticate the source.
    branches: [main]
permissions:
  contents: read
env:
  REVIEW_ADMISSION_APP_ID: ${{ vars.REVIEW_ADMISSION_APP_ID }}
  REVIEW_ADMISSION_BOT_ID: ${{ vars.REVIEW_ADMISSION_BOT_ID }}
  REVIEW_ADMISSION_INSTALLATION_ID: ${{ vars.REVIEW_ADMISSION_INSTALLATION_ID }}
jobs:
  release:
    name: Release
    # Only schedule/dispatch may prepare a new version. Trusted main CI completion wakes
    # pending finalization; the gate authenticates its source and exact successful main SHA.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    concurrency:
      group: release-main
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: write
      checks: read
      contents: write
      issues: write
      pull-requests: write
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Load the gate from trusted default-branch code, not the event's candidate.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check validated commit before setup
        id: eligible
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { cp, mkdir } = require('node:fs/promises');
            const releasePath = `${process.env.RUNNER_TEMP}/release`;
            await mkdir(releasePath, { recursive: true });
            await cp(`${process.env.GITHUB_WORKSPACE}/scripts/release`, releasePath, { recursive: true });
            await mkdir(`${process.env.RUNNER_TEMP}/ci`, { recursive: true });
            for (const name of ['review-admission-binding.mjs', 'review-admission-api.mjs', 'review-admission-policy.mjs', 'review-admission-coderabbit.mjs', 'review-admission-issuer.mjs', 'queue-configuration.mjs', 'review-admission-archive.mjs', 'review-admission-attestation.mjs']) {
              await cp(`${process.env.GITHUB_WORKSPACE}/scripts/ci/${name}`, `${process.env.RUNNER_TEMP}/ci/${name}`);
            }
            const gatePath = `${releasePath}/release-gate.mjs`;
            const { releaseEligibility } = await import(pathToFileURL(gatePath));
            const result = await releaseEligibility({ github, context, allowRecovery: Number(process.env.GITHUB_RUN_ATTEMPT) > 1 });
            core.info(result.reason);
            core.setOutput('release', String(result.release));
            core.setOutput('sha', result.sha || result.recovery?.sha || '');
            core.setOutput('recovery', String(Boolean(result.recovery)));
      - name: Validate merged release preview
        if: steps.eligible.outputs.recovery == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.eligible.outputs.sha }}
        run: |
          export GH_TOKEN="$GITHUB_TOKEN"
          source scripts/ci/github-ci-gate.sh
          require_main_revision "$RELEASE_SHA"
          require_main_ci_policy
          dispatch_ci main
          request_preview_after_dispatched_ci "$RELEASE_SHA"
          wait_for_preview_result "$RELEASE_SHA"
      - name: Recover interrupted version publication
        id: recover
        if: steps.eligible.outputs.recovery == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { releaseEligibility } = await import(pathToFileURL(`${process.env.RUNNER_TEMP}/release/release-gate.mjs`));
            const { publishRecoveredRelease } = await import(pathToFileURL(`${process.env.RUNNER_TEMP}/release/release-recovery.mjs`));
            const result = await releaseEligibility({ github, context, allowRecovery: true, validatePromotion: true });
            if (!result.recovery) throw new Error('Release recovery evidence changed.');
            await publishRecoveredRelease({ github, context, recovery: result.recovery });
            core.setOutput('version', result.recovery.version);
            core.setOutput('sha', result.recovery.sha);
            core.info(`Recovered publication of v${result.recovery.version} at ${result.recovery.sha}.`);
      # Optional notices only: catch up an existing publication even when recovery was skipped.
      # This step cannot publish; failures stay warnings and never change publication gates.
      - name: Notify released pull requests
        if: steps.eligible.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_VERSION: ${{ steps.recover.outputs.version }}
          RELEASE_SHA: ${{ steps.recover.outputs.sha }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { notifyReleasedPullRequests } = await import(pathToFileURL(`${process.env.RUNNER_TEMP}/release/release-notifications.mjs`));
            try {
              const result = await notifyReleasedPullRequests({ github, context, version: process.env.RELEASE_VERSION, sha: process.env.RELEASE_SHA });
              if (result) core.info(`Notified ${result.notified.length} PRs for ${result.tag} since ${result.previous ?? 'the first release'}.`);
              else core.info('No stable publication to notify.');
            } catch (error) {
              core.warning(`Release PR notifications incomplete: ${error.message}`);
              throw error;
            }
      - name: Checkout validated release commit
        if: steps.eligible.outputs.release == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.eligible.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The validated commit is current main and already passed CI, so its shared setup action is
      # trusted here. This keeps the pnpm pin in package.json as the single source of truth.
      - uses: ./.github/actions/setup-project
        if: steps.eligible.outputs.release == 'true'
      - name: Build
        if: steps.eligible.outputs.release == 'true'
        run: pnpm run build
        env:
          NODE_ENV: production
          APP_URL: https://tarkovtracker.org
          CLARITY_PROJECT_ID: ${{ vars.CLARITY_PROJECT_ID }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      - name: Recheck validated commit before publishing
        id: publish
        if: steps.eligible.outputs.release == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { releaseEligibility } = await import(pathToFileURL(`${process.env.RUNNER_TEMP}/release/release-gate.mjs`));
            const result = await releaseEligibility({ github, context });
            core.info(result.reason);
            core.setOutput('release', String(result.release));
      - name: Semantic Release
        id: prepare
        if: steps.publish.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/release-run.mjs
      - name: Record prepared promotion provenance
        if: steps.prepare.outputs.sha != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-promotion-${{ steps.prepare.outputs.sha }}
          path: ${{ runner.temp }}/release-promotion.json
          if-no-files-found: error
          retention-days: 30
