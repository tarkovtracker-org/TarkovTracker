name: Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  release:
    name: Release
    # workflow_run can receive privileged credentials; only trusted main push or dispatched CI may release.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    concurrency:
      group: release-main
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: write
      checks: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Load the gate from trusted default-branch code, not the event's candidate.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check validated commit before setup
        id: eligible
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { copyFile } = require('node:fs/promises');
            const gatePath = `${process.env.RUNNER_TEMP}/release-gate.mjs`;
            await copyFile(`${process.env.GITHUB_WORKSPACE}/scripts/release-gate.mjs`, gatePath);
            await copyFile(`${process.env.GITHUB_WORKSPACE}/scripts/release-recovery.mjs`, `${process.env.RUNNER_TEMP}/release-recovery.mjs`);
            const { releaseEligibility } = await import(pathToFileURL(gatePath));
            const result = await releaseEligibility({ github, context, allowRecovery: Number(process.env.GITHUB_RUN_ATTEMPT) > 1 });
            core.info(result.reason);
            core.setOutput('release', String(result.release));
            core.setOutput('sha', result.sha || '');
            core.setOutput('recovery', String(Boolean(result.recovery)));
      - name: Recover interrupted version publication
        if: steps.eligible.outputs.recovery == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { releaseEligibility } = await import(pathToFileURL(`${process.env.RUNNER_TEMP}/release-gate.mjs`));
            const { publishRecoveredRelease } = await import(pathToFileURL(`${process.env.RUNNER_TEMP}/release-recovery.mjs`));
            const result = await releaseEligibility({ github, context, allowRecovery: true });
            if (!result.recovery) throw new Error('Release recovery evidence changed.');
            await publishRecoveredRelease({ github, context, recovery: result.recovery });
            core.info(`Recovered publication of v${result.recovery.version} at ${result.recovery.sha}.`);
      - name: Checkout validated release commit
        if: steps.eligible.outputs.release == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.eligible.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The validated commit is current main and already passed CI, so its shared setup action is
      # trusted here. This keeps the pnpm pin in package.json as the single source of truth.
      - uses: ./.github/actions/setup-project
        if: steps.eligible.outputs.release == 'true'
      - name: Build
        if: steps.eligible.outputs.release == 'true'
        run: pnpm run build
        env:
          NODE_ENV: production
          APP_URL: https://tarkovtracker.org
          CLARITY_PROJECT_ID: ${{ vars.CLARITY_PROJECT_ID }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      - name: Recheck validated commit before publishing
        id: publish
        if: steps.eligible.outputs.release == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { releaseEligibility } = await import(pathToFileURL(`${process.env.RUNNER_TEMP}/release-gate.mjs`));
            const result = await releaseEligibility({ github, context });
            core.info(result.reason);
            core.setOutput('release', String(result.release));
      - name: Semantic Release
        if: steps.publish.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
