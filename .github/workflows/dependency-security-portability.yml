name: Dependency security portability
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dependency-security-portability.yml'
      - '.nvmrc'
      - 'scripts/checks/**'
      - 'scripts/workflow-tests/dependency-security.mjs'
      - 'scripts/workflow-tests/helpers/dependency-cli-loader.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/dependency-security-portability.yml'
      - '.nvmrc'
      - 'scripts/checks/**'
      - 'scripts/workflow-tests/dependency-security.mjs'
      - 'scripts/workflow-tests/helpers/dependency-cli-loader.mjs'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  portability:
    name: Dependency security (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Built-in Node tests only: no dependency installation or live credentials.
      - name: Test dependency security fixtures
        run: node --test --test-reporter=dot scripts/workflow-tests/dependency-security.mjs
