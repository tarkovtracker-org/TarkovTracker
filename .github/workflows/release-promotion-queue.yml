name: Release Promotion Queue
on:
  workflow_run:
    workflows: [Review Admission, Release]
    types: [completed]
permissions: {}
env:
  REVIEW_ADMISSION_APP_ID: ${{ vars.REVIEW_ADMISSION_APP_ID }}
  REVIEW_ADMISSION_BOT_ID: ${{ vars.REVIEW_ADMISSION_BOT_ID }}
  REVIEW_ADMISSION_INSTALLATION_ID: ${{ vars.REVIEW_ADMISSION_INSTALLATION_ID }}
jobs:
  enqueue:
    name: Enqueue reviewed version PR
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.repository.full_name == github.repository
    concurrency:
      group: release-promotion-queue
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    steps:
      - name: Checkout trusted release controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Authenticate reviewed immutable promotion and submit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const { queueReleasePromotion } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release/release-promotion-queue.mjs`);
            const result = await queueReleasePromotion({ github, context });
            core.info(JSON.stringify(result));
            await core.summary.addRaw(JSON.stringify(result)).write();
