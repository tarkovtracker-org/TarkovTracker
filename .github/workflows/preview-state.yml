name: Preview State
# Trusted controller for automatic PR and CI events. It publishes status and may request a
# separate Preview run; deployment jobs exist only in that dispatched workflow.
#
# `pull_request_target` is deliberate: fork PRs need a write token to receive a status. It is safe
# here because the job only checks out the default branch and never installs or runs candidate code.
# This public repository therefore carries a repository-level Actions policy that scopes the event
# to this workflow (GitHub blocks it by default from 2026-11-02); see "Preview Controller" in
# docs/WORKFLOW_AUTOMATION.md. Removing that policy silently disables automatic preview state.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [ready_for_review, converted_to_draft, auto_merge_enabled, closed]
concurrency:
  group: preview-state-${{ format('{0}@{1}', github.event.pull_request.head.repo.full_name || github.event.workflow_run.head_repository.full_name, github.event.pull_request.head.ref || github.event.workflow_run.head_branch) }}
  cancel-in-progress: false
permissions: {}
jobs:
  state:
    name: Refresh preview state
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Refresh Preview Result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { planPreview, publishControllerFailure, reconcileMissingPreviewStatuses } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/preview/controller.mjs`);
            if (context.eventName === 'schedule') {
              await reconcileMissingPreviewStatuses({ github, context, core, workspace: process.env.RUNNER_TEMP });
              return;
            }
            try {
              await planPreview({ github, context, core, workspace: process.env.RUNNER_TEMP });
            } catch (error) {
              await publishControllerFailure({ github, context, core });
              throw error;
            }
