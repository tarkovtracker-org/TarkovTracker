name: Preview State
run-name: Preview State PR ${{ inputs.pull_request || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || 'refresh' }}
# Trusted controller for automatic PR and CI events. It publishes status and may request a
# separate Preview run; deployment jobs exist only in that dispatched workflow.
#
# `pull_request_target` is deliberate: fork PRs need a write token to receive a status. It is safe
# here because the job only checks out the default branch and never installs or runs candidate code.
# This public repository therefore carries a repository-level Actions policy that scopes the event
# to this workflow (GitHub blocks it by default from 2026-11-02); see "Preview Controller" in
# docs/workflow-automation.md. Removing that policy silently disables automatic preview state.
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: PR whose current preview intent should be reconciled
        required: true
        type: string
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [ready_for_review, converted_to_draft, reopened, auto_merge_enabled, closed]
concurrency:
  group: preview-state-${{ inputs.pull_request || format('{0}@{1}', github.event.pull_request.head.repo.full_name || github.event.workflow_run.head_repository.full_name, github.event.pull_request.head.ref || github.event.workflow_run.head_branch) }}
  cancel-in-progress: false
permissions: {}
env:
  PREVIEW_OPT_IN_START: ${{ vars.PREVIEW_OPT_IN_START }}
  REVIEW_ADMISSION_APP_ID: ${{ vars.REVIEW_ADMISSION_APP_ID }}
  REVIEW_ADMISSION_BOT_ID: ${{ vars.REVIEW_ADMISSION_BOT_ID }}
  REVIEW_ADMISSION_INSTALLATION_ID: ${{ vars.REVIEW_ADMISSION_INSTALLATION_ID }}
jobs:
  state:
    name: Refresh preview state
    if: >-
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'merge_group')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      checks: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Refresh Preview Result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { planPreview, publishControllerFailure, reconcileMissingPreviewStatuses, reconcilePreviewRequest } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/preview/controller.mjs`);
            if (context.eventName === 'workflow_dispatch') {
              await reconcilePreviewRequest({ github, context, core, workspace: process.env.RUNNER_TEMP, number: Number(context.payload.inputs.pull_request) });
              return;
            }
            if (context.eventName === 'schedule') {
              await reconcileMissingPreviewStatuses({ github, context, core, workspace: process.env.RUNNER_TEMP });
              return;
            }
            try {
              await planPreview({ github, context, core, workspace: process.env.RUNNER_TEMP });
            } catch (error) {
              await publishControllerFailure({ github, context, core });
              throw error;
            }
