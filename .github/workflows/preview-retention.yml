name: Preview Retention
# Uses only trusted main tooling; no queue/PR artifacts or code run with credentials.
# Deployment deletion stays disabled until the reviewed activation variable is set.
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Apply bounded queue-only cleanup (also requires approved activation variable).
        type: boolean
        default: false
concurrency:
  group: pages-preview-lifecycle
  queue: max
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  retention:
    if: github.ref == 'refs/heads/main'
    name: Retain ephemeral queue previews
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: preview
    permissions:
      actions: read
      contents: read
      statuses: read
    steps:
      - name: Checkout trusted retention tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Plan or apply bounded retention
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          RETENTION_ENABLED: ${{ vars.PREVIEW_QUEUE_RETENTION_ENABLED }}
          APPLY_INPUT: ${{ inputs.apply }}
        with:
          script: |
            const { retentionPages } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/preview/retention-api.mjs`);
            const { retainQueuePreviews } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/preview/retention.mjs`);
            const requested = context.eventName === 'schedule' || process.env.APPLY_INPUT === 'true';
            const apply = requested && process.env.RETENTION_ENABLED === 'true';
            if (process.env.APPLY_INPUT === 'true' && !apply) throw new Error('Retention activation has not been approved.');
            if (apply && context.eventName === 'workflow_dispatch') {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ ...context.repo, username: context.actor });
              if (!['maintain', 'admin'].includes(data.role_name)) throw new Error('Retention apply requires a current maintainer.');
            }
            const pages = retentionPages({ accountId: process.env.CLOUDFLARE_ACCOUNT_ID, token: process.env.CLOUDFLARE_PAGES_API_TOKEN });
            const report = await retainQueuePreviews({ github, repo: context.repo, pages, workspace: process.env.GITHUB_WORKSPACE, apply });
            core.info(JSON.stringify(report));
            await core.summary.addHeading('Queue Pages retention').addCodeBlock(JSON.stringify(report, null, 2), 'json').write();
