name: Package Manager Benchmark

on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'Number of paired trials per scenario'
        required: false
        default: '5'
  push:
    branches:
      - chore/package-manager-evaluation

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: root-cold-scripts
            cache: cold
            scripts: enabled
            workspace: root
          - scenario: root-warm-scripts
            cache: warm
            scripts: enabled
            workspace: root
          - scenario: root-cold-no-scripts
            cache: cold
            scripts: disabled
            workspace: root
          - scenario: root-warm-no-scripts
            cache: warm
            scripts: disabled
            workspace: root
          - scenario: worker-cold-scripts
            cache: cold
            scripts: enabled
            workspace: worker
          - scenario: worker-warm-scripts
            cache: warm
            scripts: enabled
            workspace: worker
          - scenario: worker-cold-no-scripts
            cache: cold
            scripts: disabled
            workspace: worker
          - scenario: worker-warm-no-scripts
            cache: warm
            scripts: disabled
            workspace: worker

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc

      - name: Prepare paired config directories
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail

          git fetch origin main --depth=1
          BASE_SHA="$(git merge-base origin/main HEAD)"
          echo "Base commit (npm fixtures): $BASE_SHA"

          mkdir -p .npm-config/workers/api-gateway
          git show "$BASE_SHA:package.json" > .npm-config/package.json
          git show "$BASE_SHA:package-lock.json" > .npm-config/package-lock.json
          git show "$BASE_SHA:workers/api-gateway/package.json" > .npm-config/workers/api-gateway/package.json
          git show "$BASE_SHA:workers/api-gateway/package-lock.json" > .npm-config/workers/api-gateway/package-lock.json

          mkdir -p .pnpm-config/workers/api-gateway
          cp package.json .pnpm-config/package.json
          cp pnpm-lock.yaml .pnpm-config/pnpm-lock.yaml
          cp pnpm-workspace.yaml .pnpm-config/pnpm-workspace.yaml
          cp workers/api-gateway/package.json .pnpm-config/workers/api-gateway/package.json

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate

      - name: Run paired benchmark trials
        env:
          BENCHMARK_RUNS: ${{ inputs.runs || '5' }}
          SCENARIO_CACHE: ${{ matrix.cache }}
          SCENARIO_SCRIPTS: ${{ matrix.scripts }}
          SCENARIO_WORKSPACE: ${{ matrix.workspace }}
          SCENARIO_NAME: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          if ! [[ "$BENCHMARK_RUNS" =~ ^[1-9][0-9]*$ ]]; then
            echo "runs must be a positive integer"
            exit 1
          fi
          node scripts/package-manager-benchmark.mjs \
            --cache "$SCENARIO_CACHE" \
            --scripts "$SCENARIO_SCRIPTS" \
            --workspace "$SCENARIO_WORKSPACE" \
            --runs "$BENCHMARK_RUNS" \
            --npm-config-dir .npm-config \
            --pnpm-config-dir .pnpm-config \
            --output "results-$SCENARIO_NAME.json"

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-${{ matrix.scenario }}
          path: results-${{ matrix.scenario }}.json
          retention-days: 30

  summarize:
    needs: benchmark
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: results
          pattern: benchmark-*
          merge-multiple: true

      - name: Generate summary
        run: |
          node scripts/package-manager-benchmark-summary.mjs \
            --input-dir results \
            --output benchmark-summary.md

      - name: Upload summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-summary
          path: |
            benchmark-summary.md
            results/
          retention-days: 90
