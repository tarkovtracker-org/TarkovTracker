name: PR Controls
# One bot-owned panel; all writes run trusted main code in the existing protected environment.
on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  issue_comment:
    types: [edited]
  workflow_run:
    workflows: [CI, Preview, Preview State, Review Admission]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
        type: string
      operation:
        description: Structured review or preview operation
        required: true
        default: recheck
        type: choice
        options: [recheck, approve-review, revoke-review, preview-enable, preview-stop]
      expected_head:
        description: Exact 40-character PR head SHA
        required: true
        type: string
permissions: {}
jobs:
  targets:
    name: Select control panels
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'skipped') &&
      (github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && github.event.sender.type == 'User' &&
      startsWith(github.event.changes.body.from, '<!-- tarkovtracker:pr-controls:v1 -->')))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    env:
      REVIEW_ADMISSION_APP_ID: ${{ vars.REVIEW_ADMISSION_APP_ID }}
      REVIEW_ADMISSION_BOT_ID: ${{ vars.REVIEW_ADMISSION_BOT_ID }}
      REVIEW_ADMISSION_INSTALLATION_ID: ${{ vars.REVIEW_ADMISSION_INSTALLATION_ID }}
    outputs:
      numbers: ${{ steps.targets.outputs.numbers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Verify bounded archive prerequisite
        run: command -v unzip >/dev/null
      - id: targets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { controlTargets, publicationTargets } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/pr-controls.mjs`);
            const numbers = await controlTargets({ github, context });
            core.setOutput('numbers', JSON.stringify(await publicationTargets({ github, context, numbers, core })));
  controls:
    name: PR control panel
    needs: targets
    if: github.ref == 'refs/heads/main' && needs.targets.outputs.numbers != '[]'
    strategy:
      fail-fast: false
      matrix:
        number: ${{ fromJSON(needs.targets.outputs.numbers) }}
    # Only first-attempt workflow refreshes are interchangeable. Single-pending is the native
    # default; keep the active invocation (including its publisher) and newest waiting one.
    # Lifecycle events, checkbox edits and dispatches each retain their own invocation.
    concurrency:
      group: ${{ github.event_name == 'workflow_run' && github.run_attempt == 1 && format('pr-controls-refresh-{0}', matrix.number) || format('pr-controls-event-{0}-{1}-{2}', github.run_id, github.run_attempt, matrix.number) }}
      cancel-in-progress: false
    permissions:
      actions: write
      checks: read
      contents: read
      issues: read
      pull-requests: write
      statuses: read
    uses: ./.github/workflows/pr-controls-publish.yml
    with:
      pull_request: ${{ matrix.number }}
    secrets:
      REVIEW_ADMISSION_PRIVATE_KEY: ${{ secrets.REVIEW_ADMISSION_PRIVATE_KEY }}
