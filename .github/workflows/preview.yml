name: Preview
run-name: Preview CI ${{ inputs.run_id }} request ${{ inputs.request_comment_id || '0' }} control ${{ inputs.request_control_run_id || '0' }}
# Trusted preview controller. Every job checks out the default branch; candidate code is never
# executed, installed, or used as Wrangler configuration. The controller verifies CI evidence and
# the preview artifact's claims against live GitHub state, uploads only after an explicit trusted
# dispatch, smoke-tests the unique deployment URL, and publishes the authoritative `Preview Result`
# status. See docs/systems/previews.md. Automatic status refresh lives in preview-state.yml so
# ordinary pull requests never instantiate skipped deployment or smoke-test jobs.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful CI run id for the exact PR revision to preview.
        required: true
        type: string
      queue:
        description: Native merge queue CI profile; verified against the source run before deployment.
        required: false
        type: boolean
        default: false
      request_comment_id:
        description: Command authorizing this automatic request; omit for a manual preview.
        required: false
        type: string
      request_control_run_id:
        description: App-pinned preview enable intent; supplied by the trusted requester.
        required: false
        type: string
      authorization:
        description: Readiness policy provenance; omit for independently authorized dispatches.
        required: false
        type: string
      ci_attempt:
        description: Exact CI attempt selected by the trusted requester.
        required: false
        type: string
# Native queue deployment, smoke/result jobs and retention share one lifecycle lock. Ordinary
# previews use a per-CI-run group so fork approval waits cannot block queue deployment or cleanup.
concurrency:
  group: ${{ inputs.queue && 'pages-preview-lifecycle' || format('preview-ci-{0}', inputs.run_id) }}
  queue: ${{ inputs.queue && 'max' || 'single' }}
  cancel-in-progress: ${{ !inputs.queue }}
permissions:
  contents: read
env:
  PREVIEW_OPT_IN_START: ${{ vars.PREVIEW_OPT_IN_START }}
  REVIEW_ADMISSION_APP_ID: ${{ vars.REVIEW_ADMISSION_APP_ID }}
  REVIEW_ADMISSION_BOT_ID: ${{ vars.REVIEW_ADMISSION_BOT_ID }}
  REVIEW_ADMISSION_INSTALLATION_ID: ${{ vars.REVIEW_ADMISSION_INSTALLATION_ID }}
jobs:
  plan:
    name: Plan preview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    outputs:
      decision: ${{ steps.plan.outputs.decision }}
      action: ${{ steps.plan.outputs.action }}
      environment: ${{ steps.plan.outputs.environment }}
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Resolve candidate and verify evidence
        id: plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUN_ID_INPUT: ${{ inputs.run_id }}
          QUEUE_INPUT: ${{ inputs.queue }}
          REQUEST_COMMENT_ID_INPUT: ${{ inputs.request_comment_id }}
          REQUEST_CONTROL_RUN_ID_INPUT: ${{ inputs.request_control_run_id }}
          AUTHORIZATION_INPUT: ${{ inputs.authorization }}
          CI_ATTEMPT_INPUT: ${{ inputs.ci_attempt }}
        with:
          script: |
            const { planPreview } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/preview/controller.mjs`);
            const decision = await planPreview({
              github,
              context,
              core,
              inputs: { run_id: process.env.RUN_ID_INPUT, queue: process.env.QUEUE_INPUT, request_comment_id: process.env.REQUEST_COMMENT_ID_INPUT, request_control_run_id: process.env.REQUEST_CONTROL_RUN_ID_INPUT, authorization: process.env.AUTHORIZATION_INPUT, ci_attempt: process.env.CI_ATTEMPT_INPUT },
              workspace: process.env.RUNNER_TEMP,
            });
            core.setOutput('decision', JSON.stringify(decision));
            core.setOutput('action', decision.action);
            core.setOutput('environment', decision.environment ?? '');
            if (decision.environment === 'preview-fork' && decision.action === 'deploy') {
              await core.summary
                .addHeading('Fork preview awaiting approval', 2)
                .addRaw(`Approving deploys **exactly** revision \`${decision.headSha}\` from \`${decision.headRepo}\` (PR #${decision.pullRequest}). The deployment job re-checks the revision after approval and refuses any other head.`)
                .write();
            }
  deploy:
    name: Deploy preview
    needs: plan
    if: needs.plan.outputs.action == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A live maintainer /preview command authorizes the PR through `preview`, including forks.
    # Forks without that opt-in use `preview-fork`, with manual review or an admin override.
    environment:
      name: ${{ needs.plan.outputs.environment }}
      url: ${{ steps.verify-deployment.outputs.url }}
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    outputs:
      url: ${{ steps.verify-deployment.outputs.url }}
      deployment_id: ${{ steps.verify-deployment.outputs.deployment_id }}
      head_sha: ${{ steps.verify.outputs.head_sha }}
      digest: ${{ steps.verify.outputs.digest }}
      preview_branch: ${{ steps.verify.outputs.preview_branch }}
    steps:
      - name: Checkout trusted deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Activate packageManager
        run: bash scripts/setup/ensure-pnpm.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Pinned Wrangler from the trusted default-branch lockfile; no lifecycle scripts run here.
      - name: Install pinned deployment tooling
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Recheck revision and verify artifact
        id: verify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DECISION: ${{ needs.plan.outputs.decision }}
          QUEUE_INPUT: ${{ inputs.queue }}
        with:
          script: |
            const { verifyForDeploy } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/preview/controller.mjs`);
            const decision = JSON.parse(process.env.DECISION);
            const manifest = await verifyForDeploy({
              github,
              context,
              core,
              decision,
              queue: process.env.QUEUE_INPUT,
              destination: `${process.env.RUNNER_TEMP}/preview-dist`,
            });
            core.setOutput('head_sha', manifest.headSha);
            core.setOutput('source_ci_run_id', decision.runId);
            core.setOutput('source_ci_attempt', manifest.runAttempt);
            core.setOutput('tree_sha', manifest.treeSha);
            core.setOutput('pull_request', manifest.pullRequest ?? '');
            core.setOutput('digest', manifest.digest);
            core.setOutput('preview_branch', manifest.previewBranch);
      - name: Upload verified output to the Pages preview environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          WRANGLER_SEND_METRICS: 'false'
          PREVIEW_BRANCH: ${{ steps.verify.outputs.preview_branch }}
          HEAD_SHA: ${{ steps.verify.outputs.head_sha }}
          SOURCE_CI_RUN_ID: ${{ steps.verify.outputs.source_ci_run_id }}
        run: |
          set -euo pipefail
          case "$PREVIEW_BRANCH" in
            preview-*) ;;
            *) echo "::error::Refusing to deploy branch '$PREVIEW_BRANCH'."; exit 1 ;;
          esac
          [ "$PREVIEW_BRANCH" != "main" ]
          # Trusted explicit configuration from the default branch, never the candidate's: the
          # deploy job checks out the default branch into the workspace and Wrangler discovers
          # the repo-root wrangler.toml from there (Pages commands reject explicit config paths).
          pnpm exec wrangler pages deploy "$RUNNER_TEMP/preview-dist" \
            --project-name tarkovtracker \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$HEAD_SHA" \
            --commit-message "Actions preview for $HEAD_SHA CI $SOURCE_CI_RUN_ID controller $GITHUB_RUN_ID" \
            --commit-dirty=true
      - name: Verify deployment record
        id: verify-deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          EXPECTED_PREVIEW_BRANCH: ${{ steps.verify.outputs.preview_branch }}
          EXPECTED_HEAD_SHA: ${{ steps.verify.outputs.head_sha }}
          EXPECTED_DIGEST: ${{ steps.verify.outputs.digest }}
          # Verified build identity, recorded so the merge queue can reuse an identical tree.
          VERIFIED_TREE_SHA: ${{ steps.verify.outputs.tree_sha }}
          VERIFIED_PULL_REQUEST: ${{ steps.verify.outputs.pull_request }}
          SOURCE_CI_RUN_ID: ${{ steps.verify.outputs.source_ci_run_id }}
          SOURCE_CI_ATTEMPT: ${{ steps.verify.outputs.source_ci_attempt }}
          EVIDENCE_PATH: ${{ runner.temp }}/deployment-evidence.json
        run: node scripts/preview/verify-deployment.mjs
      - name: Retain deployment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-deployment-${{ steps.verify.outputs.head_sha || github.run_id }}
          path: ${{ runner.temp }}/deployment-evidence.json
          if-no-files-found: ignore
          retention-days: 30
  smoke:
    name: Preview smoke tests
    needs: [plan, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    permissions:
      contents: read
    steps:
      - name: Checkout trusted smoke suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Install pinned browser
        timeout-minutes: 18
        # The ubuntu-24.04 image already ships Chromium's shared libraries; Playwright's apt host
        # dependency install only added optional CJK/Thai/X11 fonts through the Ubuntu mirror, which
        # intermittently stalls for minutes. Install the headless shell from Playwright's CDN, and
        # install host dependencies through apt only when the browser cannot launch.
        # Worst case: 3 x 105s downloads + 2 x 225s apt attempts + one 180s lock wait = 945s.
        run: |
          probe() {
            node -e "import('@playwright/test').then(async ({ chromium }) => (await chromium.launch()).close())"
          }
          downloaded=false
          for attempt in 1 2 3; do
            timeout -k 15 90 pnpm exec playwright install --only-shell chromium && downloaded=true && break
            echo "::warning::Browser download attempt $attempt failed or stalled."
          done
          if [ "$downloaded" != true ]; then
            echo "::error::Browser download failed after 3 attempts."
            exit 1
          fi
          probe && exit 0
          echo "::warning::Chromium cannot launch on this runner image; installing host dependencies."
          echo 'DPkg::Lock::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-dpkg-lock-timeout >/dev/null
          for attempt in 1 2; do
            if [ "$attempt" -gt 1 ]; then
              timeout 180 sh -c 'while sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock >/dev/null 2>&1; do sleep 5; done' \
                || echo "::warning::dpkg lock still held after 180s."
            fi
            timeout -k 15 210 pnpm exec playwright install-deps chromium && probe && exit 0
            echo "::warning::Browser dependency install attempt $attempt failed or stalled."
          done
          echo "::error::Chromium still cannot launch after installing host dependencies."
          exit 1
      - name: Run smoke tests against the unique deployment URL
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.url }}
          EXPECTED_HEAD_SHA: ${{ needs.deploy.outputs.head_sha }}
          EXPECTED_DIGEST: ${{ needs.deploy.outputs.digest }}
          EXPECTED_PREVIEW_BRANCH: ${{ needs.deploy.outputs.preview_branch }}
          SMOKE_REPORT_DIR: ${{ runner.temp }}/smoke-report
          PREVIEW_ACCESS_CLIENT_ID: ${{ secrets.PREVIEW_ACCESS_CLIENT_ID }}
          PREVIEW_ACCESS_CLIENT_SECRET: ${{ secrets.PREVIEW_ACCESS_CLIENT_SECRET }}
        run: pnpm exec playwright test --config scripts/preview/smoke/playwright.config.mjs
      - name: Retain smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-smoke-${{ needs.deploy.outputs.head_sha || github.run_id }}
          path: ${{ runner.temp }}/smoke-report
          if-no-files-found: ignore
          retention-days: 30
  result:
    name: Publish preview result
    needs: [plan, deploy, smoke]
    if: always() && needs.plan.outputs.action != 'ignore'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout trusted reporting
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Publish Preview Result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RUN_ID_INPUT: ${{ inputs.run_id }}
          DECISION: ${{ needs.plan.outputs.decision }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.url }}
          DEPLOYMENT_ID: ${{ needs.deploy.outputs.deployment_id }}
        with:
          script: |
            const { publishResult, publishControllerFailure } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/preview/controller.mjs`);
            const decision = process.env.DECISION ? JSON.parse(process.env.DECISION) : null;
            if (process.env.PLAN_RESULT === 'cancelled') {
              // Superseded by a newer run in this preview's concurrency group: the successor
              // owns reporting for this candidate, and the runner already marked this run
              // cancelled — publishing would be a false failure on a superseded attempt.
              core.notice('Preview run superseded by a newer run for the same candidate.');
              return;
            }
            if (process.env.PLAN_RESULT !== 'success' || !decision) {
              await publishControllerFailure({ github, context, core, decision, inputs: { run_id: process.env.RUN_ID_INPUT } });
              core.setFailed('Preview planning did not succeed.');
              return;
            }
            try {
              await publishResult({
                github,
                context,
                core,
                decision,
                outcomes: { deploy: process.env.DEPLOY_RESULT, smoke: process.env.SMOKE_RESULT },
                evidence: { url: process.env.DEPLOYMENT_URL, deploymentId: process.env.DEPLOYMENT_ID },
              });
            } catch (error) {
              await publishControllerFailure({ github, context, core, decision });
              throw error;
            }
