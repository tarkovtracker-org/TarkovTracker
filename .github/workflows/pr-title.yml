name: PR Title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
# Body-only edits also fire `edited`; this job is a few seconds and never touches other workflows.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          install-dependencies: 'false'
      # Squash merges make the PR title the commit on main. Fix a failure by editing the title;
      # no commit rewording or force-push is needed.
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/checks/check-pr-title.mjs
