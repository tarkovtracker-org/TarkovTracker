name: Precompute Tarkov Data
# Publish neutral mode catalogs, language tables, and independent English import snapshots.
# Catalog activation follows a successful readback of every immutable gzip object. A missed
# run leaves the last complete catalog release available for its seven-day TTL.
#
# Requires (see scripts/precompute/run.ts):
#   environment production-precompute - main branch only; credentials below must not exist at repository scope
#   secret CLOUDFLARE_API_TOKEN          - scoped to Workers KV Storage: Edit
#   secret OVERLAY_TOKEN                 - read-only Contents on the private tarkov-data-overlay repo
#   variable CLOUDFLARE_ACCOUNT_ID       - account that owns the namespace
#   variable TARKOV_DATA_KV_NAMESPACE_ID - id of the TARKOV_DATA namespace
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      lang:
        description: 'Use en for a targeted English import refresh. Leave both lang and gameMode empty for a complete catalog release.'
        required: false
        type: string
      gameMode:
        description: 'Target one English import snapshot (regular, pve, or pvp-season). Empty runs all modes.'
        required: false
        type: string
      previewOnly:
        description: 'Refresh preview from the latest complete production release. Leave both filters empty.'
        required: false
        type: boolean
      expectedOverlaySha:
        description: 'Required overlay SHA for this release (optional).'
        required: false
        type: string
concurrency:
  group: precompute-tarkov-data
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
jobs:
  precompute:
    name: Precompute catalogs and language tables
    if: github.ref == 'refs/heads/main'
    environment: production-precompute
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Reject preview-only runs with filters
        if: inputs.previewOnly && (inputs.lang || inputs.gameMode)
        run: |
          echo "::error::Preview refresh requires a complete release. Remove both filters."
          exit 1
      - name: Precompute and write to KV
        if: '!inputs.previewOnly'
        # Filters flow through env vars, never shell interpolation, so
        # workflow_dispatch inputs cannot inject into the run command.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TARKOV_DATA_KV_NAMESPACE_ID: ${{ vars.TARKOV_DATA_KV_NAMESPACE_ID }}
          EXPECTED_OVERLAY_SHA: ${{ inputs.expectedOverlaySha }}
          OVERLAY_TOKEN: ${{ secrets.OVERLAY_TOKEN }}
          PRECOMPUTE_LANG: ${{ inputs.lang }}
          PRECOMPUTE_GAME_MODE: ${{ inputs.gameMode }}
        run: pnpm run precompute:tarkov
      - name: Refresh the isolated preview catalog
        if: inputs.previewOnly || (!inputs.lang && !inputs.gameMode)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TARKOV_DATA_KV_NAMESPACE_ID: ${{ vars.TARKOV_DATA_KV_NAMESPACE_ID }}
          EXPECTED_OVERLAY_SHA: ${{ inputs.expectedOverlaySha }}
        run: pnpm run precompute:preview
      - name: Upload overlay provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: overlay-precompute-manifest
          path: precompute-manifest.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Open or update failure issue
        if: failure() && github.event_name == 'schedule'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Precompute Tarkov Data failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The scheduled Precompute Tarkov Data workflow failed.',
              '',
              `- Run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              '',
              'Check the production publish and isolated preview refresh steps in the run.',
              'KV entries have a 7-day TTL; investigate before they expire.',
              'EFT log imports fail once the tasks-import snapshots expire (no runtime fallback).',
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
