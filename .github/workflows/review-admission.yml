name: Queue metadata read probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const observations = [];
            const queries = [
              ['pr-entry', 'query { repository(owner:"tarkovtracker-org",name:"TarkovTracker") { pullRequest(number:1240) { headRefOid mergeQueueEntry { position baseCommit { oid } headCommit { oid } pullRequest { number headRefOid } } } } }'],
              ['queue-id', 'query { repository(owner:"tarkovtracker-org",name:"TarkovTracker") { mergeQueue(branch:"main") { id } } }'],
              ['queue-config', 'query { repository(owner:"tarkovtracker-org",name:"TarkovTracker") { mergeQueue(branch:"main") { configuration { maximumEntriesToBuild maximumEntriesToMerge mergeMethod mergingStrategy } } } }'],
              ['original-query', 'query { repository(owner:"tarkovtracker-org",name:"TarkovTracker") { pullRequest(number:1240) { headRefOid mergeQueueEntry { position baseCommit { oid } headCommit { oid } pullRequest { number headRefOid } mergeQueue { configuration { maximumEntriesToBuild maximumEntriesToMerge mergeMethod mergingStrategy } } } } } }'],
            ];
            for (const [name, query] of queries) {
              try {
                observations.push({name, data: await github.graphql(query)});
              } catch (error) {
                observations.push({name, errors: (error.errors || []).map(({type,path,message}) => ({type,path,message}))});
              }
            }
            for (const [name, route] of [
              ['effective-rules', 'GET /repos/{owner}/{repo}/rules/branches/{branch}'],
              ['disabled-rule', 'GET /repos/{owner}/{repo}/rulesets/{ruleset_id}'],
            ]) {
              try {
                const {status,data} = await github.request(route, {...context.repo, branch:'main', ruleset_id:25157234});
                const rules = Array.isArray(data) ? data : data.rules;
                observations.push({name,status,rules:rules.map(({type,parameters,ruleset_id}) => ({type,parameters,ruleset_id}))});
              } catch (error) {
                observations.push({name,status:error.status,message:error.message});
              }
            }
            for (const observation of observations) core.info(JSON.stringify(observation));
