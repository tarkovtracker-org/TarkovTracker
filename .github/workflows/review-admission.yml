name: Queue metadata read probe
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Owned canary PR number
        type: number
        default: 1240
        required: true
      wait_for_entry:
        description: Wait up to 60 seconds for an entry before the field probe
        type: boolean
        default: false
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const number = Number(context.payload.inputs.pr_number);
            if (!Number.isSafeInteger(number) || number <= 0) throw new Error('Expected a positive PR number.');
            const observations = [];
            const repo = (body) => `query { repository(owner:"tarkovtracker-org",name:"TarkovTracker") { ${body} } }`;
            const pr = (body) => repo(`pullRequest(number:${number}) { ${body} }`);
            const safeErrors = (error) => (error.errors || []).map(({type,path}) => ({
              type: typeof type === 'string' ? type.replace(/[^A-Z_]/g, '') : 'UNKNOWN',
              path: Array.isArray(path) ? path.filter((part) => Number.isSafeInteger(part) || (typeof part === 'string' && /^[a-zA-Z_][a-zA-Z0-9_]{0,79}$/.test(part))) : [],
            }));
            const read = async (name, query) => {
              try {
                const data = await github.graphql(query);
                observations.push({name,data});
                return {data};
              } catch (error) {
                const errors = safeErrors(error);
                observations.push({name,errors});
                return {errors};
              }
            };
            await read('root-queue-id', repo('mergeQueue(branch:"main") { id }'));
            for (const field of ['maximumEntriesToBuild','maximumEntriesToMerge','mergeMethod','mergingStrategy']) {
              await read(`root-config-${field}`, repo(`mergeQueue(branch:"main") { configuration { ${field} } }`));
            }
            if (context.payload.inputs.wait_for_entry === 'true') {
              const deadline = Date.now() + 60000;
              let polls = 0;
              while (Date.now() < deadline) {
                polls += 1;
                try {
                  const data = await github.graphql(pr('headRefOid mergeQueueEntry { id }'));
                  if (data.repository?.pullRequest?.mergeQueueEntry) {
                    observations.push({name:'entry-observed',polls,data});
                    break;
                  }
                } catch (error) {
                  observations.push({name:'entry-wait-error',polls,errors:safeErrors(error)});
                  break;
                }
                await new Promise((resolve) => setTimeout(resolve, 2000));
              }
              observations.push({name:'entry-wait-complete',polls});
            }
            for (const [name,selection] of [
              ['entry-id','id'],
              ['entry-position','position'],
              ['entry-base','baseCommit { oid }'],
              ['entry-head','headCommit { oid }'],
              ['entry-member','pullRequest { number headRefOid }'],
              ['entry-queue-id','mergeQueue { id }'],
              ['entry-queue-config','mergeQueue { configuration { maximumEntriesToBuild maximumEntriesToMerge mergeMethod mergingStrategy } }'],
              ['reduced-membership','position baseCommit { oid } headCommit { oid } pullRequest { number headRefOid }'],
              ['original-combined','position baseCommit { oid } headCommit { oid } pullRequest { number headRefOid } mergeQueue { configuration { maximumEntriesToBuild maximumEntriesToMerge mergeMethod mergingStrategy } }'],
            ]) {
              await read(name, pr(`headRefOid mergeQueueEntry { ${selection} }`));
            }
            try {
              const rules = await github.paginate('GET /repos/{owner}/{repo}/rules/branches/{branch}', {...context.repo,branch:'main',per_page:100});
              observations.push({name:'effective-rules',status:200,rules:rules.filter(({type}) => type === 'merge_queue').map(({type,parameters,ruleset_id,ruleset_source,ruleset_source_type}) => ({type,parameters,ruleset_id,ruleset_source,ruleset_source_type}))});
            } catch (error) {
              observations.push({name:'effective-rules',status:error.status || 'UNKNOWN'});
            }
            for (const observation of observations) core.info(JSON.stringify(observation));
