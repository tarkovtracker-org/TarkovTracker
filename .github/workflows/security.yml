name: Security
# Reusable security gate. CI calls it for pull requests, main pushes, and explicit dispatches
# (including Crowdin and release staging) and requires its success in `CI Result`. The weekly
# schedule keeps the standalone audit; ordinary push and pull_request triggers were removed so the
# scans run exactly once per revision, inside the gated CI run.
on:
  workflow_call:
  schedule:
    - cron: '0 0 * * 0'
permissions:
  contents: read
jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Prepare pnpm audit workspace
        id: prepare-audit
        run: |
          audit_dir="$RUNNER_TEMP/pnpm-audit"
          mkdir -p "$audit_dir"
          cp pnpm-lock.yaml package.json "$audit_dir/"
          echo "audit_dir=$audit_dir" >> "$GITHUB_OUTPUT"
      - name: Audit production dependencies
        working-directory: ${{ steps.prepare-audit.outputs.audit_dir }}
        # Blocking threshold: critical vulnerabilities in production dependencies fail CI.
        run: pnpm audit --prod --audit-level=critical
      - name: Audit all dependencies (informational)
        working-directory: ${{ steps.prepare-audit.outputs.audit_dir }}
        # Advisory only: development-dependency findings are reported, never gated.
        run: |
          if ! pnpm audit --audit-level=high; then
            echo "::notice title=Informational dependency audit::High-severity findings exist in development dependencies. This audit is advisory and does not gate CI."
          fi
      - name: Check for outdated dependencies
        if: github.event_name == 'schedule'
        run: pnpm outdated || true
      - name: Install Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"
          checksums_path="$RUNNER_TEMP/gitleaks_checksums.txt"
          checksum_entry_path="$RUNNER_TEMP/gitleaks_checksum.txt"
          install_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$install_dir"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            -o "$archive_path"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            -o "$checksums_path"
          awk -v archive="$archive" '$2 == archive { print }' "$checksums_path" > "$checksum_entry_path"
          test -s "$checksum_entry_path"
          (
            cd "$RUNNER_TEMP"
            sha256sum --check --strict "$checksum_entry_path"
          )
          tar -xzf "$archive_path" -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
        env:
          GITLEAKS_VERSION: 8.30.1
      - name: Gitleaks scan
        id: gitleaks
        continue-on-error: true
        run: |
          gitleaks git . \
            --exit-code 1 \
            --no-banner \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif
      - name: Upload Gitleaks report
        if: steps.gitleaks.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail on Gitleaks findings
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "::error::Gitleaks detected secrets. Review the gitleaks-report artifact."
          exit 1
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: javascript-typescript
          queries: security-extended
      # The analysis must complete; individual alerts are triaged in code scanning, not here.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
