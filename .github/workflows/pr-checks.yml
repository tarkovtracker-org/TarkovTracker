name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  pr-meta:
    name: PR Meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-label PR
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate and apply size label
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const additions = files.reduce((sum, file) => sum + file.additions, 0);
            const deletions = files.reduce((sum, file) => sum + file.deletions, 0);
            const total = additions + deletions;

            let label = 'size/S';
            if (total > 1000) label = 'size/XXL';
            else if (total > 500) label = 'size/XL';
            else if (total > 250) label = 'size/L';
            else if (total > 100) label = 'size/M';

            const { data: existingLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const sizeLabels = existingLabels
              .map(l => l.name)
              .filter(name => name.startsWith('size/'));

            if (sizeLabels.length === 1 && sizeLabels[0] === label) {
              console.log(`Size label ${label} already correct, skipping`);
              return;
            }

            for (const name of sizeLabels) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name,
              });
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label],
            });

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate commit messages
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'performance') || contains(github.event.pull_request.labels.*.name, 'ui')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build
        env:
          NODE_ENV: production

      - name: Run Lighthouse
        run: |
          npm run preview &
          npx wait-on http://localhost:3000 --timeout 30000

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000
            http://localhost:3000/tasks
            http://localhost:3000/hideout
          uploadArtifacts: true
          temporaryPublicStorage: true
