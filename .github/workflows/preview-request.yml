name: Request Preview
# Commands execute trusted main-branch code. No pull request code or artifacts are loaded here.
on:
  issue_comment:
    types: [created]
permissions: {}
env:
  PREVIEW_OPT_IN_START: ${{ vars.PREVIEW_OPT_IN_START }}
  REVIEW_ADMISSION_APP_ID: ${{ vars.REVIEW_ADMISSION_APP_ID }}
  REVIEW_ADMISSION_BOT_ID: ${{ vars.REVIEW_ADMISSION_BOT_ID }}
  REVIEW_ADMISSION_INSTALLATION_ID: ${{ vars.REVIEW_ADMISSION_INSTALLATION_ID }}
jobs:
  request:
    name: Request preview
    if: >-
      github.event.issue.pull_request &&
      contains(fromJSON('["/preview", "/preview stop"]'), github.event.comment.body) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
      contents: read
      issues: read
      pull-requests: write
      statuses: read
    steps:
      - name: Checkout trusted request handler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Dispatch current validated preview
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { PreviewRequestDenied, requestPreviewFromComment, previewRequestMessage, minimizePreviewCommand } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/preview/comment-request.mjs`);
            const reply = async (body) => github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.issue.number,
              body,
            });
            try {
              const request = await requestPreviewFromComment({ github, context });
              const runs = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/preview.yml`;
              await reply(previewRequestMessage(request, runs))
                .catch((replyError) => core.warning(`Could not post preview request feedback: ${replyError.message}`));
              await minimizePreviewCommand({ github, context, core });
              core.notice(`Preview intent for PR #${request.pullRequest}: enabled=${request.enabled}, CI run=${request.ciRunId ?? 'waiting'}.`);
            } catch (error) {
              if (error instanceof PreviewRequestDenied) throw error;
              const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              await reply(`Preview command could not finish processing. [See the request run](${run}) for the reason. Comment \`/preview stop\` to disable automatic previews.`)
                .catch((replyError) => core.warning(`Could not post preview request feedback: ${replyError.message}`));
              throw error;
            }
