name: Setup project
description: Activate the pinned runtime and pnpm, cache packages, and install the frozen workspace.
inputs:
  install-dependencies:
    description: Set false for tools that only need the verified runtime and package-manager pin.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
    - name: Activate packageManager
      shell: bash
      run: bash scripts/setup/ensure-pnpm.sh
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: inputs.install-dependencies != 'false'
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Install dependencies
      if: inputs.install-dependencies != 'false'
      shell: bash
      run: pnpm install --frozen-lockfile
