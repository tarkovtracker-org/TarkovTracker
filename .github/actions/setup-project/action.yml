name: Setup project
description: Activate the pinned runtime and pnpm, cache packages, and install the frozen workspace.
inputs:
  install-dependencies:
    description: Set false for tools that only need the verified runtime and package-manager pin.
    default: 'true'
  check-dependency-security:
    description: Run dependency security before installing in jobs without a separate preflight.
    default: 'false'
  prepare-nuxt:
    description: Set false to skip only the root Nuxt preparation during installation.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
    - name: Activate packageManager
      shell: bash
      run: bash scripts/setup/ensure-pnpm.sh
    - name: Dependency Security before installation
      if: inputs.check-dependency-security == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: node scripts/checks/dependency-security.mjs
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: inputs.install-dependencies != 'false'
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Install dependencies
      if: inputs.install-dependencies != 'false'
      shell: bash
      env:
        TARKOVTRACKER_SKIP_NUXT_PREPARE: ${{ inputs.prepare-nuxt == 'false' }}
      run: pnpm install --frozen-lockfile
